    <!-- Anti-Flash Theme Script (Prevents flash of wrong theme) -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('sw_rag_theme');
          var theme = saved;
          if (!theme) {
            theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>
    <!-- User / Device Session Isolation Script -->
    <script>
      (function() {
        try {
          var key = 'sw_rag_user_id';
          var uid = localStorage.getItem(key);
          if (!uid) {
            uid = 'usr_' + Math.random().toString(36).substring(2, 11) + Date.now().toString(36);
            localStorage.setItem(key, uid);
          }
          // Set cookie for browser HTTP requests
          document.cookie = 'sw_user_id=' + uid + '; path=/; max-age=31536000; SameSite=Lax';

          // Intercept fetch to automatically attach X-User-ID header to all /api/ calls
          var origFetch = window.fetch;
          window.fetch = function(input, init) {
            init = init || {};
            var url = typeof input === 'string' ? input : (input && input.url ? input.url : '');
            if (url.indexOf('/api/') !== -1) {
              if (!init.headers) {
                init.headers = {};
              }
              if (init.headers instanceof Headers) {
                init.headers.set('X-User-ID', uid);
              } else if (Array.isArray(init.headers)) {
                init.headers.push(['X-User-ID', uid]);
              } else {
                init.headers['X-User-ID'] = uid;
              }
            }
            return origFetch.call(this, input, init);
          };
        } catch (e) {
          console.error('Session isolation script error:', e);
        }
      })();
    </script>
