    <!-- Anti-Flash Theme Script (Prevents flash of wrong theme) -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('sw_rag_theme');
          var theme = saved;
          if (!theme) {
            theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>
    <!-- User / Device Session Isolation Script -->
    <script>
      (function() {
        try {
          var key = 'sw_rag_user_id';
          var uid = localStorage.getItem(key);
          if (!uid) {
            uid = 'usr_' + Math.random().toString(36).substring(2, 11) + Date.now().toString(36);
            localStorage.setItem(key, uid);
          }
          // Set cookie for browser HTTP requests
          document.cookie = 'sw_user_id=' + uid + '; path=/; max-age=31536000; SameSite=Lax';

          // Intercept fetch to automatically attach X-User-ID header to all /api/ calls
          var origFetch = window.fetch;
          window.fetch = function(input, init) {
            init = init || {};
            var url = typeof input === 'string' ? input : (input && input.url ? input.url : '');
            if (url.indexOf('/api/') !== -1) {
              if (!init.headers) {
                init.headers = {};
              }
              if (init.headers instanceof Headers) {
                init.headers.set('X-User-ID', uid);
              } else if (Array.isArray(init.headers)) {
                init.headers.push(['X-User-ID', uid]);
              } else {
                init.headers['X-User-ID'] = uid;
              }
            }
            return origFetch.call(this, input, init);
          };
        } catch (e) {
          console.error('Session isolation script error:', e);
        }
      })();
    </script>

    <style>
      /* Interactive Follow-up Question Suggestions */
      .rag-suggestions-container {
        list-style: none !important;
        padding-left: 0 !important;
        margin: 12px 0 6px 0 !important;
        display: flex;
        flex-direction: column;
        gap: 6px;

      .rag-suggestion-chip {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 6px 13px;
        border-radius: 8px;
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(59, 130, 246, 0.28);

        font-size: 0.88rem;
        font-weight: 500;

        line-height: 1.4;
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);

      [data-theme="dark"] .rag-suggestion-chip:hover {
        background: rgba(59, 130, 246, 0.24);
        border-color: rgba(96, 165, 250, 0.6);
        color: #93c5fd;
        box-shadow: 0 4px 14px rgba(59, 130, 246, 0.3);
      }

        font-size: 1.15rem;
        font-weight: 700;
        color: #2563eb;
        line-height: 1;
        transition: transform 0.2s ease;
      }
      [data-theme="dark"] .rag-suggestion-arrow {

  <body>
    <div id="root"></div>

    <!-- Interactive Follow-up Question Suggestions Script -->
    <script>
      (function() {
        function enhanceFollowUpSuggestions() {
          var items = document.querySelectorAll('.message-row.bot li, .message-row.bot p');
          for (var i = 0; i < items.length; i++) {
            var el = items[i];
            if (el.dataset.suggestionEnhanced) continue;
            var text = el.textContent || '';
            if (text.indexOf('↳') !== -1 || text.indexOf('\u21b3') !== -1) {
              el.dataset.suggestionEnhanced = 'true';
              
              var parentUl = el.closest('ul');
              if (parentUl && !parentUl.dataset.suggestionsUl) {
                parentUl.dataset.suggestionsUl = 'true';
                parentUl.classList.add('rag-suggestions-container');
              }

              var parts = text.split(/↳|\u21b3/);
              if (parts.length > 1) {
                var questionText = parts.slice(1).join('').trim();
                if (questionText) {
                  el.innerHTML = '<button type="button" class="rag-suggestion-chip" data-question="' + 
                    encodeURIComponent(questionText) + '" title="Klik untuk langsung menanyakan ini">' +
                    '<span class="rag-suggestion-arrow">↳</span>' +
                    '<span class="rag-suggestion-text">' + questionText + '</span>' +
                    '</button>';
                  el.classList.add('rag-suggestion-item');
                }
              }
            }
          }
        }

        // Delegated click handler: sets textarea value & submits automatically
        document.addEventListener('click', function(e) {
          var chip = e.target.closest('.rag-suggestion-chip');
          if (!chip) return;
          e.preventDefault();
          e.stopPropagation();

          var question = decodeURIComponent(chip.dataset.question || '').trim();
          if (!question) {
            var textEl = chip.querySelector('.rag-suggestion-text');
            question = textEl ? textEl.textContent.trim() : '';
          }
          if (!question) return;

          var textarea = document.querySelector('.chat-textarea');
          if (!textarea) return;

          // Native property descriptor setter so React tracks state change
          var setter = Object.getOwnPropertyDescriptor(window.HTMLTextAreaElement.prototype, 'value').set;
          setter.call(textarea, question);
          textarea.dispatchEvent(new Event('input', { bubbles: true }));
          textarea.focus();

          chip.style.transform = 'scale(0.96)';
          setTimeout(function() {
            chip.style.transform = '';
            var sendBtn = document.querySelector('.btn-send');
            if (sendBtn && !sendBtn.disabled) {
              sendBtn.click();
            }
          }, 120);
        });

        // MutationObserver to enhance newly rendered bot message turns
        var observer = new MutationObserver(function() {
          enhanceFollowUpSuggestions();
        });
        observer.observe(document.body, { childList: true, subtree: true });
        window.addEventListener('DOMContentLoaded', enhanceFollowUpSuggestions);
      })();
    </script>
